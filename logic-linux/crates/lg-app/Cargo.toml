[package]
name = "lg-app"
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "lg_app"
path = "src/lib.rs"

# (working name until the user picks one)
[[bin]]
name = "bramble-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37"
lg-core = { path = "../lg-core" }
# the suite's look (colours and colour themes, controls, liquid glass, icons, window frame)
kn-ui = { path = "../../../keynote-linux/crates/kn-ui" }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
# sound: rodio over cpal (ALSA / PulseAudio / PipeWire, WASAPI, CoreAudio), as Bramble Notes
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "flac"] }
# SoundFont instruments played natively (pure Rust, MIT)
rustysynth = "1"
lg-dsp = { path = "../lg-dsp" }
lg-audio = { path = "../lg-audio" }
lg-players = { path = "../lg-players" }
lg-synth = { path = "../lg-synth" }
# the sample library's one-shots in the Browser
lg-sounds = { path = "../lg-sounds" }
lg-fx = { path = "../lg-fx" }
lg-notation = { path = "../lg-notation" }
# glyph outlines for the Score's printed PDF (already built by the suite's kn-ui)
ab_glyph = "0.2"
# hosting third-party CLAP, VST3 and LV2 plug-ins
lg-host = { path = "../lg-host" }
# MIDI keyboards and controllers (ALSA / CoreMIDI / WinMM)
midir = "0.11"
# custom track icons (PNG / JPEG pictures; the suite's kn-ui already builds this crate)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

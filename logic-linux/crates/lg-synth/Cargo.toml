[package]
name = "lg-synth"
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Bramble Studio's software instruments: synthesized stand-ins for Logic's keyboards, synths, drums and the Sampler."

[dependencies]
lg-dsp = { path = "../lg-dsp" }
rustysynth = "1"
lg-sounds = { path = "../lg-sounds" }
# FLAC decoding for the Sampler (pure Rust; already in the workspace through rodio)
symphonia = { version = "0.5", default-features = false, features = ["flac"] }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Letters — Bramble Office</title>
  <link data-trunk rel="copy-file" href="../pg-app/data/icons/letters-256.png" />
  <link rel="icon" type="image/png" href="letters-256.png" />
  <link data-trunk rel="copy-dir" href="../../../keynote-linux/crates/kn-render/fonts/matched" data-target-path="fonts/matched" />
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="pg-web" data-wasm-opt="z" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #bramble_canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      outline: none;
    }
    #bramble_loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #1e1e1e;
      z-index: 10;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: #f7a23e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #bramble_loading p { margin: 0; font-size: 14px; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="bramble_canvas"></canvas>
  <div id="bramble_loading">
    <div class="spinner"></div>
    <p>Loading Letters…</p>
  </div>
</body>
</html>

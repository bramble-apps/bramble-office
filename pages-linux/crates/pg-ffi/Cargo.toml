[package]
name = "pg-ffi"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"

# Letters' engine for other front ends (the Flutter app for Android): a C interface, built as
# libletters_core.so (`cargo rustc -p pg-ffi --lib --crate-type cdylib`)
[lib]
name = "letters_core"
path = "src/lib.rs"

[dependencies]
pg-core = { path = "../pg-core" }
serde_json = "1.0.154"

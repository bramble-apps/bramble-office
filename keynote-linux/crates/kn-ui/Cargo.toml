[package]
name = "kn-ui"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-only"

# Keydeck's look, shared with Numdeck: colours and colour themes, controls (steppers, toggles,
# disclosures), liquid glass and translucent panes, toolbar icons, window frame.
[dependencies]
spellbook = "0.4.2"
eframe = { version = "0.37.0", default-features = false }
egui = "0.37"
# emoji in colour (Noto Color Emoji / Segoe UI Emoji) wherever the suite draws text
epaint = { version = "0.37", features = ["color_fonts"] }
kn-format = { path = "../kn-format" }
kn-model = { path = "../kn-model" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiny-skia = "0.12.0"
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the patched winit (vendor/): Wayland client-side shadow margins for the window frame
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
ureq = "3.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Location",
    "Event",
    "EventTarget",
    "BeforeUnloadEvent",
    "ClipboardEvent",
    "DataTransfer",
    "FileList",
    "File",
    "Storage",
    "MessageEvent",
    "UrlSearchParams",
    "Response",
    "RequestInit",
    "RequestMode",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.6"

# macOS: our own NSVisualEffectView, put BEHIND the content view (window-vibrancy adds it as a
# subview of the content view, which on a layer-backed Metal view covers everything drawn)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSColor", "NSGraphics"] }
raw-window-handle = "0.6"

# Android: the NativeActivity glue, Java calls (file picker, links, keyboard) and logcat
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
jni = "0.21.1"
android_logger = "0.15"
log = "0.4"

# the system's file dialogs (Android and WebAssembly have their own pickers, in android.rs / web/)
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.17.2"
# clipboard.rs: pictures, copied files and HTML on the clipboard (the same arboard egui-winit uses)
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }

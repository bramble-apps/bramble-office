[package]
name = "kn-format"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11"
snap = "1.1.2"
# newer Keynote / Pages / Numbers files compress some .iwa parts with Apple's LZFSE / LZVN
lzfse_rust = "0.2.1"
uuid = { version = "1.28.0", features = ["v4"] }
zip = "9.0.5"

[package]
name = "kn-app"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "keydeck"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kn-format = { version = "0.1.0", path = "../kn-format" }
kn-model = { version = "0.1.0", path = "../kn-model" }
kn-render = { version = "0.1.0", path = "../kn-render" }
kn-ui = { version = "0.1.0", path = "../kn-ui" }
rfd = "0.17.2"
zip = "9.0.5"
roxmltree = "0.20"
# GNOME-style (Adwaita) title bar for Settings > Title bar: System (Wayland has no server-side ones on GNOME)
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

# Settings > Translucent sidebars: the system's own blur behind the window (vibrancy on macOS,
# mica / acrylic on Windows); Linux desktops get the frosted wallpaper drawn by the app
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.6"

[build-dependencies]
winresource = "0.1.34"

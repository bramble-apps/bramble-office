[package]
name = "kn-app"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"

# the app itself (also Android's native library: tools/android/build-apk.sh)
[lib]
name = "kn_app"
path = "src/lib.rs"

[[bin]]
name = "keydeck"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kn-format = { path = "../kn-format" }
kn-model = { path = "../kn-model" }
kn-render = { path = "../kn-render" }
kn-ui = { path = "../kn-ui" }
zip = "9.0.5"
# the document library for other front ends (ffi.rs): its answers as JSON
serde_json = "1.0.154"
roxmltree = "0.20"
# GNOME-style (Adwaita) title bar for Settings > Title bar: System (Wayland has no server-side ones on GNOME)
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

# Settings > Translucent sidebars: the system's own blur behind the window (vibrancy on macOS,
# mica / acrylic on Windows); Linux desktops get the frosted wallpaper drawn by the app
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.6"

[build-dependencies]
winresource = "0.1.34"

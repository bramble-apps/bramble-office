<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- E · Tripod flip pad: a blue backing board on a telescoping aluminium tripod; the pad hangs
       from three binder rings, pages flipped over the top show behind, the front page curls at
       the corner, a marker lies in the tray, collars and rubber feet on the legs -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#3584e4"/></linearGradient>
    <linearGradient id="alu" x1="0" x2="1"><stop offset="0" stop-color="#9a9996"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".6" stop-color="#deddda"/><stop offset="1" stop-color="#77767b"/></linearGradient>
    <linearGradient id="aluDark" x1="0" x2="1"><stop offset="0" stop-color="#5e5c64"/><stop offset=".4" stop-color="#9a9996"/><stop offset="1" stop-color="#3d3846"/></linearGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#77767b"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#5e5c64"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#deddda"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="screw" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c0bfbc"/><stop offset="1" stop-color="#5e5c64"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <ellipse cx="64" cy="119" rx="46" ry="6" fill="url(#shadow)"/>

  <!-- back leg (darker, further away) -->
  <rect x="62" y="88" width="4" height="22" fill="url(#aluDark)"/>
  <rect x="61" y="99" width="6" height="3" rx="1" fill="#3d3846"/>
  <rect x="61" y="109" width="6" height="4" rx="1.5" fill="#241f31"/>

  <!-- front legs: upper tube, clamp collar, thinner lower tube (rotated), feet drawn flat -->
  <g transform="translate(52 88) rotate(20)">
    <rect x="-3" y="0" width="6" height="17" fill="url(#alu)"/>
    <rect x="-4" y="16" width="8" height="5" rx="1.5" fill="#3d3846"/>
    <path d="M-3.5 16.8h7" stroke="#77767b" stroke-width=".8"/>
    <rect x="-2.2" y="21" width="4.4" height="10" fill="url(#alu)"/>
  </g>
  <g transform="translate(76 88) rotate(-20)">
    <rect x="-3" y="0" width="6" height="17" fill="url(#alu)"/>
    <rect x="-4" y="16" width="8" height="5" rx="1.5" fill="#3d3846"/>
    <path d="M-3.5 16.8h7" stroke="#77767b" stroke-width=".8"/>
    <rect x="-2.2" y="21" width="4.4" height="10" fill="url(#alu)"/>
  </g>
  <rect x="37" y="115" width="9" height="4.5" rx="2" fill="#241f31"/>
  <path d="M38.5 115.6h6" stroke="#5e5c64" stroke-width=".8"/>
  <rect x="82" y="115" width="9" height="4.5" rx="2" fill="#241f31"/>
  <path d="M83.5 115.6h6" stroke="#5e5c64" stroke-width=".8"/>

  <!-- tripod head block with slotted screw -->
  <rect x="54" y="86" width="20" height="8" rx="2.5" fill="#3d3846"/>
  <path d="M56 86.6h16" stroke="#77767b" stroke-width=".8"/>
  <circle cx="64" cy="90" r="2.6" fill="url(#screw)"/>
  <path d="M62.3 91.2l3.4-2.4" stroke="#3d3846" stroke-width=".9"/>

  <!-- backing board: lip, face, 1px top highlight -->
  <rect x="16" y="16" width="96" height="74" rx="6" fill="#1a5fb4"/>
  <rect x="16" y="14" width="96" height="72" rx="6" fill="url(#board)"/>
  <path d="M22 14.6h84" stroke="#99c1f1" stroke-width="1"/>

  <!-- pages flipped over the top, visible behind the rings -->
  <path d="M25 18h78v4H25z" fill="#c0bfbc"/>
  <path d="M25 16.5h78v2H25z" fill="#deddda"/>
  <path d="M25 18.5h78" stroke="#9a9996" stroke-width=".6"/>

  <!-- pad: alternating light/dark page edges along the bottom -->
  <rect x="24" y="22" width="80" height="62" rx="1" fill="#9a9996"/>
  <rect x="24" y="22" width="80" height="61" rx="1" fill="#f6f5f4"/>
  <rect x="24" y="22" width="80" height="60" rx="1" fill="#c0bfbc"/>
  <rect x="24" y="22" width="80" height="59" rx="1" fill="#ffffff"/>
  <rect x="24" y="22" width="80" height="58" rx="1" fill="#deddda"/>
  <!-- the sheet under the curl -->
  <rect x="24" y="22" width="80" height="57" rx="1" fill="#f6f5f4"/>
  <!-- soft shadow cast by the curl onto the sheet below -->
  <path d="M90 79l14-13v6c-3 4-8 7-12 8z" fill="#000" opacity=".28" filter="url(#soft)"/>
  <!-- front page with the corner folded away -->
  <path d="M25 22h78a1 1 0 0 1 1 1v43l-14 13H25a1 1 0 0 1-1-1V23a1 1 0 0 1 1-1z" fill="url(#paper)"/>
  <!-- curled flap -->
  <path d="M104 66L90 79c1.5-5 4-9.5 7-11.5 2-1.2 4.5-1.5 7-1.5z" fill="url(#curl)"/>
  <path d="M104 66L90 79" stroke="#9a9996" stroke-width=".5" opacity=".6"/>

  <!-- punched holes with ring shadows -->
  <ellipse cx="42" cy="26.5" rx="2.4" ry="1.7" fill="#3d3846"/>
  <ellipse cx="64" cy="26.5" rx="2.4" ry="1.7" fill="#3d3846"/>
  <ellipse cx="86" cy="26.5" rx="2.4" ry="1.7" fill="#3d3846"/>

  <!-- slide content: title, two lines of text, bars with a trend line -->
  <rect x="31" y="32" width="34" height="5" rx="2.5" fill="#1c71d8"/>
  <rect x="31" y="41" width="22" height="2.5" rx="1.25" fill="#c0bfbc"/>
  <rect x="31" y="46" width="26" height="2.5" rx="1.25" fill="#c0bfbc"/>
  <rect x="33" y="60" width="9" height="13" rx="1.2" fill="#f6d32d"/>
  <rect x="46" y="54" width="9" height="19" rx="1.2" fill="#33d17a"/>
  <rect x="59" y="47" width="9" height="26" rx="1.2" fill="#3584e4"/>
  <rect x="72" y="40" width="9" height="33" rx="1.2" fill="#e01b24"/>
  <path d="M31 73.5h56" stroke="#9a9996" stroke-width="1"/>
  <path d="M37.5 56l13-6 13-7 13-8" fill="none" stroke="#613583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37.5" cy="56" r="1.8" fill="#613583"/><circle cx="50.5" cy="50" r="1.8" fill="#613583"/><circle cx="63.5" cy="43" r="1.8" fill="#613583"/><circle cx="76.5" cy="35" r="2.2" fill="#613583"/>

  <!-- binder rings: front arc from the hole over the top edge, with specular line -->
  <g fill="none" stroke-linecap="round">
    <path d="M42 26.5V15a4 4 0 0 1 8 0v3" stroke="url(#ring)" stroke-width="2.6"/>
    <path d="M64 26.5V15a4 4 0 0 1 8 0v3" stroke="url(#ring)" stroke-width="2.6"/>
    <path d="M86 26.5V15a4 4 0 0 1 8 0v3" stroke="url(#ring)" stroke-width="2.6"/>
    <path d="M41.6 25V15.5a4 4 0 0 1 2-3.4M63.6 25V15.5a4 4 0 0 1 2-3.4M85.6 25V15.5a4 4 0 0 1 2-3.4" stroke="#ffffff" stroke-width=".7" opacity=".9"/>
  </g>

  <!-- marker tray with lip and a marker -->
  <rect x="14" y="86" width="100" height="6" rx="2" fill="#9a9996"/>
  <rect x="14" y="86" width="100" height="1.2" rx=".6" fill="#ffffff" opacity=".8"/>
  <rect x="14" y="90.5" width="100" height="1.5" rx=".75" fill="#5e5c64"/>
  <rect x="80" y="81.5" width="20" height="5" rx="2.5" fill="#3d3846"/>
  <rect x="81" y="81.9" width="18" height="1.1" rx=".55" fill="#9a9996"/>
  <rect x="96" y="81.5" width="7" height="5" rx="2" fill="#e01b24"/>
  <rect x="96" y="81.8" width="7" height="1.2" rx=".6" fill="#f66151"/>
</svg>

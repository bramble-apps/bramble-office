<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- J · Chalkboard easel: grained A-frame legs joined by a wing bolt, slate board in a bevelled
       wooden frame with chalk haze and an inner shadow, a slide held by two bevelled magnets
       (its lower corner lifting off with a shadow), chalk arrow and underline, a tray with chalk
       sticks and a felt eraser, capped feet -->
  <defs>
    <linearGradient id="leg" x1="0" x2="1"><stop offset="0" stop-color="#865e3c"/><stop offset=".45" stop-color="#cdab8f"/><stop offset="1" stop-color="#865e3c"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdab8f"/><stop offset="1" stop-color="#986a44"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3846"/><stop offset="1" stop-color="#241f31"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="curl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#c0bfbc"/><stop offset="1" stop-color="#deddda"/></linearGradient>
    <radialGradient id="magRed" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#f66151"/><stop offset=".6" stop-color="#e01b24"/><stop offset="1" stop-color="#a51d2d"/></radialGradient>
    <radialGradient id="magBlue" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#99c1f1"/><stop offset=".6" stop-color="#3584e4"/><stop offset="1" stop-color="#1a5fb4"/></radialGradient>
    <radialGradient id="haze"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="screw" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c0bfbc"/><stop offset="1" stop-color="#5e5c64"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>
  <ellipse cx="64" cy="120" rx="48" ry="6" fill="url(#shadow)"/>

  <!-- back leg -->
  <path d="M61 10h6l2 104h-10z" fill="#63452c"/>
  <rect x="58.5" y="112" width="11" height="4" rx="1.5" fill="#241f31"/>
  <!-- front legs with grain -->
  <path d="M55 6h7L33 117h-8z" fill="url(#leg)"/>
  <path d="M66 6h7l30 111h-8z" fill="url(#leg)"/>
  <g fill="none" stroke="#63452c" stroke-width=".5" opacity=".6">
    <path d="M58 12l-24 92M59.5 20l-18 70"/>
    <path d="M70 12l24 92M68.5 20l18 70"/>
  </g>
  <rect x="23" y="115" width="11" height="5" rx="2" fill="#241f31"/>
  <rect x="94" y="115" width="11" height="5" rx="2" fill="#241f31"/>
  <!-- wing bolt at the apex -->
  <path d="M59 7l-4-2.6 1-1.6 4.6 2.8zM69 7l4-2.6-1-1.6-4.6 2.8z" fill="#9a9996"/>
  <circle cx="64" cy="8" r="3.4" fill="url(#screw)"/>
  <path d="M62 9.2l4-2.4" stroke="#3d3846" stroke-width=".9"/>

  <!-- board: wooden frame (lip, face, highlight), slate with inner shadow and chalk haze -->
  <rect x="10" y="18" width="108" height="72" rx="4" fill="#63452c"/>
  <rect x="10" y="16" width="108" height="72" rx="4" fill="url(#frame)"/>
  <path d="M14 16.6h100" stroke="#e8d3c0" stroke-width="1"/>
  <g fill="none" stroke="#865e3c" stroke-width=".5" opacity=".6">
    <path d="M14 19.5c20 .8 40-.6 60 .3s30 .2 40-.3"/>
    <path d="M13 22v58M115 23c.6 18-.6 38 0 58"/>
  </g>
  <rect x="17" y="22" width="94" height="60" rx="1.5" fill="url(#slate)"/>
  <rect x="17" y="22" width="94" height="5" fill="url(#inner)"/>
  <path d="M17.5 22v60" stroke="#000" stroke-width="1" opacity=".35"/>
  <ellipse cx="40" cy="70" rx="22" ry="9" fill="url(#haze)"/>
  <ellipse cx="94" cy="38" rx="16" ry="10" fill="url(#haze)"/>

  <!-- chalk marks: arrow towards the slide, underline, tick -->
  <g fill="none" stroke="#f6f5f4" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M100 74c-2-8-6-12-12-14" stroke-width="1.6"/>
    <path d="M91 57.5l-3.4 2.6 4 1.6" stroke-width="1.6"/>
    <path d="M24 77h22" stroke-width="1.4" stroke-dasharray="8 2 10 0"/>
    <path d="M95 34l3 3.5 7-8" stroke-width="1.5"/>
  </g>

  <!-- slide: shadow, sheet with lifted corner, content -->
  <g transform="rotate(-3 54 49)">
    <path d="M27 30h56v34l-9 8H27z" fill="#000" opacity=".4" transform="translate(1.5 2)" filter="url(#soft)"/>
    <path d="M26 28h56v33l-10 9H26z" fill="url(#paper)"/>
    <path d="M82 61l-10 9c1-4 3-6.5 5.5-7.8 1.4-.8 3-1.2 4.5-1.2z" fill="url(#curl)"/>
    <path d="M73 71.5c3-1 6-3.5 9-8.5" fill="none" stroke="#000" stroke-width="1.6" opacity=".3" filter="url(#soft)"/>
    <rect x="32" y="34" width="26" height="4.5" rx="2.25" fill="#c64600"/>
    <rect x="32" y="42" width="18" height="2.4" rx="1.2" fill="#c0bfbc"/>
    <rect x="32" y="47" width="22" height="2.4" rx="1.2" fill="#c0bfbc"/>
    <circle cx="67" cy="50" r="9.5" fill="#57e389"/>
    <path d="M67 40.5a9.5 9.5 0 0 1 9.5 9.5H67z" fill="#26a269"/>
    <path d="M67 50l-7.5 5.8A9.5 9.5 0 0 1 57.5 50z" fill="#f6d32d"/>
    <path d="M32 65l7-8 5 5 4-4 7 7z" fill="#62a0ea"/>
  </g>

  <!-- magnets: contact shadow, bevelled dome, specular highlight -->
  <ellipse cx="28.5" cy="31.5" rx="6" ry="5" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="27" cy="29.5" r="5.4" fill="#a51d2d"/>
  <circle cx="27" cy="29" r="4.8" fill="url(#magRed)"/>
  <path d="M24 27a3.6 3.6 0 0 1 4-1.8" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <ellipse cx="83" cy="29" rx="6" ry="5" fill="#000" opacity=".45" filter="url(#soft)"/>
  <circle cx="81.5" cy="27" r="5.4" fill="#1a5fb4"/>
  <circle cx="81.5" cy="26.5" r="4.8" fill="url(#magBlue)"/>
  <path d="M78.5 24.5a3.6 3.6 0 0 1 4-1.8" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".9"/>

  <!-- chalk tray: lip, highlight, chalk sticks, felt eraser -->
  <rect x="8" y="86" width="112" height="7" rx="2" fill="#865e3c"/>
  <rect x="8" y="86" width="112" height="1.4" rx=".7" fill="#e8d3c0"/>
  <rect x="8" y="91" width="112" height="2" rx="1" fill="#63452c"/>
  <rect x="26" y="83" width="13" height="3.4" rx="1.7" fill="#ffffff"/>
  <rect x="26" y="85.2" width="13" height="1.2" rx=".6" fill="#c0bfbc"/>
  <rect x="42" y="83.4" width="9" height="3" rx="1.5" fill="#f9f06b"/>
  <rect x="42" y="85.3" width="9" height="1.1" rx=".55" fill="#e5a50a"/>
  <rect x="84" y="77" width="22" height="5.5" rx="1.5" fill="#cdab8f"/>
  <path d="M85.5 77.6h19" stroke="#f6f5f4" stroke-width=".8"/>
  <path d="M88 79.6h4M96 80.2h6" stroke="#986a44" stroke-width=".5"/>
  <rect x="84" y="82" width="22" height="4.4" rx="1" fill="#5e5c64"/>
  <path d="M85 83.6h20M85 85h20" stroke="#3d3846" stroke-width=".5" stroke-dasharray="1 1"/>
  <ellipse cx="95" cy="86.4" rx="11" ry="1" fill="#f6f5f4" opacity=".3"/>
</svg>

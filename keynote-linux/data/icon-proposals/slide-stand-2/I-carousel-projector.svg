<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- I · Carousel slide projector: blue rotary tray with 40 slots full of slide mounts, a centre
       hub with slotted lock knob, one slide lifted out of its slot; projector body with top face,
       lip, knurled focus ring, glowing lens with reflections, vent grille, buttons, elevation
       foot with thumb wheel, rubber feet -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#deddda"/></linearGradient>
    <linearGradient id="topface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#deddda"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="trayTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#99c1f1"/><stop offset="1" stop-color="#3584e4"/></linearGradient>
    <linearGradient id="traySide" x1="0" x2="1"><stop offset="0" stop-color="#1a5fb4"/><stop offset=".35" stop-color="#3584e4"/><stop offset=".6" stop-color="#1c71d8"/><stop offset="1" stop-color="#1a5fb4"/></linearGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#77767b"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#5e5c64"/></linearGradient>
    <radialGradient id="glass" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#f9f06b"/><stop offset=".75" stop-color="#e5a50a"/><stop offset="1" stop-color="#865e3c"/></radialGradient>
    <radialGradient id="bloom"><stop offset="0" stop-color="#f9f06b" stop-opacity=".55"/><stop offset="1" stop-color="#f9f06b" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#99c1f1"/></linearGradient>
  </defs>
  <ellipse cx="64" cy="110" rx="56" ry="7" fill="url(#shadow)"/>

  <!-- rubber feet and elevation foot with thumb wheel -->
  <rect x="16" y="102" width="12" height="5" rx="2" fill="#241f31"/>
  <rect x="100" y="102" width="12" height="5" rx="2" fill="#241f31"/>
  <rect x="35" y="102" width="6" height="7" fill="url(#metal)"/>
  <rect x="31" y="106" width="14" height="4" rx="2" fill="#3d3846"/>
  <path d="M33 106.5v3M35 106.5v3M37 106.5v3M39 106.5v3M41 106.5v3M43 106.5v3" stroke="#77767b" stroke-width=".6"/>

  <!-- body: top face, front with lip, highlight -->
  <path d="M16 54h96l7 8H9z" fill="url(#topface)"/>
  <path d="M17 54.5h94" stroke="#ffffff" stroke-width="1"/>
  <rect x="9" y="62" width="110" height="42" rx="6" fill="#9a9996"/>
  <rect x="9" y="62" width="110" height="38" rx="6" fill="url(#body)"/>
  <path d="M9 62.5h110" stroke="#c0bfbc" stroke-width="1"/>
  <path d="M14 63.6h100" stroke="#ffffff" stroke-width="1"/>

  <!-- vent grille: recessed slots with lit lower edges -->
  <g stroke-linecap="round">
    <path d="M70 72h40M70 76h40M70 80h40M70 84h40M70 88h40" stroke="#5e5c64" stroke-width="1.6"/>
    <path d="M70 73.1h40M70 77.1h40M70 81.1h40M70 85.1h40M70 89.1h40" stroke="#ffffff" stroke-width=".7"/>
  </g>
  <!-- forward / back buttons and a small power LED -->
  <rect x="88" y="93" width="9" height="4.5" rx="2" fill="#3d3846"/>
  <rect x="99" y="93" width="9" height="4.5" rx="2" fill="#3d3846"/>
  <path d="M89.5 93.6h6M100.5 93.6h6" stroke="#9a9996" stroke-width=".7"/>
  <circle cx="113" cy="95.2" r="1.3" fill="#ff7800"/>

  <!-- lens: bloom, housing, knurled focus ring, barrel, glass with reflections -->
  <circle cx="38" cy="82" r="24" fill="url(#bloom)"/>
  <circle cx="38" cy="82" r="17" fill="#3d3846"/>
  <circle cx="38" cy="82" r="15.5" fill="#5e5c64"/>
  <circle cx="38" cy="82" r="14.6" fill="none" stroke="#241f31" stroke-width="1.6" stroke-dasharray="1 1.3"/>
  <path d="M27.5 72.5a15 15 0 0 1 21 0" fill="none" stroke="#9a9996" stroke-width="1"/>
  <circle cx="38" cy="82" r="12" fill="#241f31"/>
  <circle cx="38" cy="82" r="10.6" fill="none" stroke="#77767b" stroke-width=".8"/>
  <circle cx="38" cy="82" r="9" fill="url(#glass)"/>
  <path d="M32 77.5a8 8 0 0 1 6-3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="42.5" cy="86" r="1.2" fill="#ffffff" opacity=".8"/>

  <!-- carousel tray: base ring, side band, top -->
  <ellipse cx="64" cy="49" rx="46" ry="10.5" fill="#1a5fb4"/>
  <rect x="18" y="40" width="92" height="9" fill="url(#traySide)"/>
  <path d="M18 47.5a46 10.5 0 0 0 92 0" fill="none" stroke="#99c1f1" stroke-width=".7" opacity=".6"/>
  <ellipse cx="64" cy="40" rx="46" ry="10.5" fill="url(#trayTop)"/>
  <path d="M24 35a46 10.5 0 0 1 80 0" fill="none" stroke="#ffffff" stroke-width=".9" opacity=".8"/>
  <!-- slide mounts packed in the slots -->
  <ellipse cx="64" cy="40" rx="41.5" ry="9.3" fill="#f6f5f4"/>
  <ellipse cx="64" cy="40" rx="41.5" ry="9.3" fill="none" stroke="#1c71d8" stroke-width=".8"/>
  <path d="M89.0 40.0L105.0 40.0M88.7 40.9L104.5 41.4M87.8 41.7L103.0 42.8M86.3 42.5L100.5 44.2M84.2 43.3L97.2 45.4M81.7 44.0L93.0 46.5M78.7 44.5L88.1 47.4M75.3 45.0L82.6 48.2M71.7 45.3L76.7 48.7M67.9 45.5L70.4 49.1M64.0 45.6L64.0 49.2M60.1 45.5L57.6 49.1M56.3 45.3L51.3 48.7M52.7 45.0L45.4 48.2M49.3 44.5L39.9 47.4M46.3 44.0L35.0 46.5M43.8 43.3L30.8 45.4M41.7 42.5L27.5 44.2M40.2 41.7L25.0 42.8M39.3 40.9L23.5 41.4M39.0 40.0L23.0 40.0M39.3 39.1L23.5 38.6M40.2 38.3L25.0 37.2M41.7 37.5L27.5 35.8M43.8 36.7L30.8 34.6M46.3 36.0L35.0 33.5M49.3 35.5L39.9 32.6M52.7 35.0L45.4 31.8M56.3 34.7L51.3 31.3M60.1 34.5L57.6 30.9M64.0 34.4L64.0 30.8M67.9 34.5L70.4 30.9M71.7 34.7L76.7 31.3M75.3 35.0L82.6 31.8M78.7 35.5L88.1 32.6M81.7 36.0L93.0 33.5M84.2 36.7L97.2 34.6M86.3 37.5L100.5 35.8M87.8 38.3L103.0 37.2M88.7 39.1L104.5 38.6" stroke="#9a9996" stroke-width=".7"/>
  <!-- hub -->
  <ellipse cx="64" cy="40" rx="25" ry="5.6" fill="#1c71d8"/>
  <ellipse cx="64" cy="39.6" rx="23.5" ry="5" fill="#62a0ea"/>
  <rect x="57" y="35" width="14" height="4" fill="url(#metal)"/>
  <ellipse cx="64" cy="39" rx="7" ry="2" fill="#5e5c64"/>
  <ellipse cx="64" cy="35" rx="7" ry="2" fill="url(#metal)"/>
  <path d="M61.5 35.3l5-.6" stroke="#3d3846" stroke-width=".8"/>

  <!-- one slide lifted from its front slot: shadow, mount, window -->
  <rect x="69" y="27" width="18" height="19" rx="2" fill="#000" opacity=".2"/>
  <rect x="67" y="25" width="18" height="21" rx="2" fill="#f6f5f4"/>
  <rect x="67" y="25" width="18" height="21" rx="2" fill="none" stroke="#c0bfbc" stroke-width=".8"/>
  <path d="M68.5 25.6h15" stroke="#ffffff" stroke-width="1"/>
  <rect x="70" y="28.5" width="12" height="12" fill="url(#sky)"/>
  <circle cx="79" cy="31.5" r="1.6" fill="#f9f06b"/>
  <path d="M70 40.5l4-5.5 3 3 2-2 3 4.5z" fill="#2ec27e"/>
  <rect x="67" y="43" width="18" height="3" fill="#deddda"/>
</svg>

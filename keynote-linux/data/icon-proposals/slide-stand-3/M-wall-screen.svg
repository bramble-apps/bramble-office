<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- M · Wall Screen: a round roller case with moulded end caps, white matte fabric with the rolled
       layers showing at the slot, a projected slide, and a weighted bottom bar with a moulded grip -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#deddda"/><stop offset=".22" stop-color="#ffffff"/><stop offset=".55" stop-color="#deddda"/><stop offset=".85" stop-color="#9a9996"/><stop offset="1" stop-color="#77767b"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9996"/><stop offset=".22" stop-color="#deddda"/><stop offset=".55" stop-color="#9a9996"/><stop offset=".85" stop-color="#5e5c64"/><stop offset="1" stop-color="#3d3846"/></linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="hang" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".1"/><stop offset=".08" stop-color="#000" stop-opacity="0"/><stop offset=".92" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3584e4"/><stop offset="1" stop-color="#1c71d8"/></linearGradient>
    <radialGradient id="hot" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9996"/><stop offset=".45" stop-color="#5e5c64"/><stop offset="1" stop-color="#3d3846"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- soft shadow cast on the wall -->
  <rect x="19" y="18" width="90" height="82" rx="3" fill="#000" opacity=".2" filter="url(#drop)"/>

  <!-- fabric: gentle top-lit gradient, darker side hang, shade under the case -->
  <rect x="20" y="20" width="88" height="70" fill="url(#fabric)"/>
  <rect x="20" y="20" width="88" height="70" fill="url(#hang)"/>
  <!-- projected slide -->
  <rect x="27" y="30" width="74" height="50" rx="1" fill="url(#slide)"/>
  <rect x="33" y="36" width="30" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="33" y="45" width="20" height="2.5" rx="1.25" fill="#99c1f1"/>
  <rect x="36" y="62" width="10" height="12" rx="1.2" fill="#f8e45c"/>
  <rect x="50" y="56" width="10" height="18" rx="1.2" fill="#8ff0a4"/>
  <rect x="64" y="49" width="10" height="25" rx="1.2" fill="#ffffff"/>
  <rect x="78" y="41" width="10" height="33" rx="1.2" fill="#ffbe6f"/>
  <path d="M33 74.5h62" stroke="#99c1f1" stroke-width="1"/>
  <rect x="27" y="30" width="74" height="50" rx="1" fill="url(#hot)"/>
  <rect x="20" y="20" width="88" height="8" fill="url(#under)"/>

  <!-- roller case: tube with specular line, slot with rolled fabric layers, moulded end caps -->
  <rect x="11" y="7" width="106" height="17" rx="8.5" fill="url(#case)"/>
  <path d="M18 9.6h92" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="18" y="20.5" width="92" height="3" rx="1.5" fill="#5e5c64"/>
  <path d="M19.5 21.6h89" stroke="#deddda" stroke-width=".5"/>
  <path d="M19.5 22.6h89" stroke="#ffffff" stroke-width=".6"/>
  <rect x="5" y="6" width="14" height="19" rx="5" fill="url(#cap)"/>
  <rect x="109" y="6" width="14" height="19" rx="5" fill="url(#cap)"/>
  <rect x="7.5" y="8.5" width="9" height="14" rx="3.5" fill="#000" opacity=".08"/>
  <rect x="111.5" y="8.5" width="9" height="14" rx="3.5" fill="#000" opacity=".08"/>
  <path d="M9 6.6h6M113 6.6h6" stroke="#f6f5f4" stroke-width="1" stroke-linecap="round"/>
  <path d="M19.4 8v15M108.6 8v15" stroke="#3d3846" stroke-width="1" opacity=".4"/>
  <path d="M20.2 9v13M107.8 9v13" stroke="#ffffff" stroke-width=".6" opacity=".7"/>

  <!-- weighted bottom bar with a moulded grip -->
  <ellipse cx="64" cy="98" rx="46" ry="2.5" fill="#000" opacity=".18" filter="url(#drop)"/>
  <path d="M19.5 88h89a3.5 3.5 0 0 1 0 7H75q-1.2 5.5-6 5.5h-10q-4.8 0-6-5.5H19.5a3.5 3.5 0 0 1 0-7z" fill="url(#bar)"/>
  <path d="M19.5 88.7h89" stroke="#c0bfbc" stroke-width="1" stroke-linecap="round"/>
  <rect x="58" y="95.2" width="12" height="2.6" rx="1.3" fill="#241f31"/>
</svg>

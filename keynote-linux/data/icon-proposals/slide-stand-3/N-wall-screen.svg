<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- N · Wall Screen: a squared extruded housing (top face, front face, chamfer), a screen with a
       black masking border, a projected pie chart and bar graph, and a slim bottom bar with a finger notch -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#deddda"/><stop offset="1" stop-color="#c0bfbc"/></linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9996"/><stop offset="1" stop-color="#5e5c64"/></linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5f4"/></linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0bfbc"/><stop offset=".5" stop-color="#9a9996"/><stop offset="1" stop-color="#5e5c64"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3584e4"/><stop offset="1" stop-color="#1c71d8"/></linearGradient>
    <linearGradient id="pieB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#1c71d8"/></linearGradient>
    <linearGradient id="pieO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa348"/><stop offset="1" stop-color="#e66100"/></linearGradient>
    <linearGradient id="pieY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e45c"/><stop offset="1" stop-color="#e5a50a"/></linearGradient>
    <linearGradient id="barY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e45c"/><stop offset="1" stop-color="#e5a50a"/></linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57e389"/><stop offset="1" stop-color="#26a269"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#1c71d8"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <!-- soft shadow cast on the wall -->
  <rect x="17" y="20" width="94" height="80" rx="3" fill="#000" opacity=".2" filter="url(#drop)"/>

  <!-- screen: black masking border, top drop, matte fabric -->
  <rect x="17" y="22" width="94" height="72" fill="#241f31"/>
  <rect x="20" y="28" width="88" height="63" fill="url(#fabric)"/>

  <!-- projected content: a pie chart on the left, a bar graph on the right -->
  <ellipse cx="44" cy="62.6" rx="15" ry="15" fill="#000" opacity=".16" filter="url(#soft)"/>
  <circle cx="44" cy="61" r="15" fill="url(#pieB)"/>
  <path d="M44 61V46a15 15 0 0 1 14.3 19.5z" fill="url(#pieO)"/>
  <path d="M44 61l14.3 4.5A15 15 0 0 1 34 72.2z" fill="url(#pieY)"/>
  <path d="M31.5 53a15 15 0 0 1 11-6.9" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <g filter="url(#soft)" opacity=".16" fill="#000">
    <rect x="67" y="65" width="8" height="15"/><rect x="79" y="55" width="8" height="25"/><rect x="91" y="46" width="8" height="34"/>
  </g>
  <rect x="67" y="64" width="8" height="15" rx="1" fill="url(#barY)"/>
  <rect x="79" y="54" width="8" height="25" rx="1" fill="url(#barG)"/>
  <rect x="91" y="45" width="8" height="34" rx="1" fill="url(#barB)"/>
  <path d="M68 64.6h6M80 54.6h6M92 45.6h6" stroke="#ffffff" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
  <path d="M64 79.5h38" stroke="#9a9996" stroke-width="1.2" stroke-linecap="round"/>

  <!-- shade under the housing -->
  <rect x="17" y="22" width="94" height="10" fill="url(#under)"/>

  <!-- housing: top face, front face, chamfer, slot; darker end plates -->
  <path d="M12 6h104a3 3 0 0 1 3 3v12l-3 3H12l-3-3V9a3 3 0 0 1 3-3z" fill="#77767b"/>
  <path d="M12 6h104a3 3 0 0 1 3 3v2H9V9a3 3 0 0 1 3-3z" fill="url(#top)"/>
  <rect x="9" y="11" width="110" height="10" fill="url(#front)"/>
  <path d="M11 6.6h106" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <path d="M9 11.5h110" stroke="#9a9996" stroke-width=".8" opacity=".6"/>
  <path d="M15 16.1h98" stroke="#9a9996" stroke-width=".7" opacity=".5"/>
  <path d="M15 16.9h98" stroke="#ffffff" stroke-width=".7" opacity=".8"/>
  <path d="M9 21h110l-3 3H12z" fill="url(#end)"/>
  <rect x="18" y="22.2" width="92" height="1.8" rx=".9" fill="#241f31"/>
  <path d="M9 9a3 3 0 0 1 3-3h3v18h-3l-3-3z" fill="url(#end)"/>
  <path d="M119 9a3 3 0 0 0-3-3h-3v18h3l3-3z" fill="url(#end)"/>
  <path d="M10.5 6.8h4M113.5 6.8h4" stroke="#c0bfbc" stroke-width=".8" stroke-linecap="round"/>

  <!-- slim bottom bar with a finger notch -->
  <ellipse cx="64" cy="98" rx="48" ry="2.5" fill="#000" opacity=".18" filter="url(#drop)"/>
  <path d="M16 90h96a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H74q-2 3.5-5 3.5h-10q-3 0-5-3.5H16a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z" fill="url(#bar)"/>
  <path d="M16 90.6h96" stroke="#f6f5f4" stroke-width="1" stroke-linecap="round"/>
  <path d="M15 96.4h39M74 96.4h39" stroke="#3d3846" stroke-width=".8" opacity=".6"/>
  <rect x="58" y="96.4" width="12" height="1.8" rx=".9" fill="#3d3846"/>
</svg>
